#cloud-config
package_update: true
package_upgrade: true
runcmd:
  - [ sh, -c, "if command -v apt-get >/dev/null 2>&1; then apt-get update -y; DEBIAN_FRONTEND=noninteractive apt-get install -y apache2; systemctl enable --now apache2; elif command -v dnf >/dev/null 2>&1; then dnf install -y httpd; systemctl enable --now httpd; elif command -v yum >/dev/null 2>&1; then yum install -y httpd; systemctl enable --now httpd; fi" ]
  - [ sh, -c, "echo '<h1>Deploy of the Terraform</h1>' > /var/www/html/index.html" ]
output: {all: '| tee -a /var/log/cloud-init-output.log'}